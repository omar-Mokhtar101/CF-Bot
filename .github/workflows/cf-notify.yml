name: Codeforces Discord Reminder

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REMIND_WINDOW_HOURS: "48"
        run: python notify.py

      - name: Commit updated state
        run: |
          git config user.name "cf-discord-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notified.json
          git diff --staged --quiet || git commit -m "Update notified contests"
          git push
